    assets continue to outperform over the next period; rotating capital LONG into
    the top-ranked captures the continuation. Mechanism: under-reaction to
    asset-specific information + flow-chasing of relative winners (24/7 retail
    attention). Counterparty: late rotators and non-rotating index-like holders
    who under-react to relative performance.

