       needs a 10-30 alt universe to be meaningful (universe-expansion = infra)."
    - "Turnover/cost: frequent rotation -> cost-dead net of conservative round-trip
       (the VPT lesson)."

  # QUALITY GATE (DEC-2026-06-04-018, Stage 1 -- by hand 2026-06-09) ----------
  quality_gate:
