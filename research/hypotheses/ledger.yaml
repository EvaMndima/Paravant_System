- id: H-2026-06-004
  name: "Liquidation-cascade reversion (buy the long-liquidation flush)"
  status: PROPOSED   # Stage-1 PASS; build BLOCKED on paid-data (DEC-2026-06-04-005)
  proposed_date: 2026-06-09
  proposed_by: operator   # operator-requested 2026-06-09 ("pursue a liquidation strategy")
  source: >-
    Crypto market-microstructure / forced-deleveraging literature
    (liquidation-cascade studies; Coinglass liquidation-map practitioner
    research). Sourced for the uncovered HIGH_VOL / reversal regime as a
    contrarian liquidation-flow mechanism the portfolio entirely lacks.

  # PRE-REGISTRATION ---------------------------------------------------------
  hypothesis: |
    In a high-volatility down-move, over-leveraged LONG positions hit
    maintenance margin and are force-liquidated: the exchange liquidation engine
    market-sells the position PRICE-INSENSITIVELY (it must close before the
    trader goes negative, at any price). A cascade occurs when the first wave of
    forced selling drives price into the next cluster of liquidation prices,
    triggering more forced sells -- a self-reinforcing waterfall that pushes
    price BELOW fair value (overshoot). Once the leveraged longs are flushed,
    forced selling stops and price snaps back toward fair value as opportunistic
    spot bids step in. A SPOT LONG entered into the flush provides liquidity to
    the forced sellers and captures the mean-reversion snap-back.

    Counterparty: force-liquidated leveraged longs. Why they persist losing:
    (a) high leverage is durable retail behaviour on the dominant perp venues;
    (b) at liquidation they are MECHANICALLY price-insensitive sellers -- the
    engine dumps at market regardless of fair value, so they systematically sell
    the bottom. The spot long is the liquidity provider into that forced flush.

    Direction = LONG (buy the long-liquidation flush). SPOT-executable, so a pass
    would be LIVE-DEPLOYABLE (unlike a short-squeeze fade, which the spot-only
    live lock DEC-2026-05-28-001 still gates).
  regime_target: HIGH_VOL   # reversal cell; NOT the dead trending_bull
  expected_pf: 1.35          # honest prior; results >> this would be a RED FLAG
  expected_sharpe: 0.80
  expected_n_per_year: 40    # ONLY reachable by moderate cascade threshold + symbol pooling
  expected_fail_modes:
    - "Snap-back < cost: the overshoot is real but too small / too fast to
       capture on 1H bars net of conservative round-trip costs (VPT pattern)."
    - "Crowding/front-run: liquidation maps are PUBLIC (Coinglass heatmaps);
       'buy the flush' is a known game; faster players arbitrage the snap-back
       -> no residual 1H edge (the H-002/H-003 inverse-crowding failure)."
    - "Cascade is a REGIME CHANGE not an overshoot: a big flush often marks the
       START of a sustained down-leg (capitulation continues) -> buying it
       catches a falling knife -> negative edge."
    - "Threshold dilution: lowering the cascade threshold to reach N>=30 trades
       away the 'big overshoot' edge -> small flushes carry no reversion."
    - "Data leakage: cascade magnitude is only fully known AFTER it completes;
       must trigger on liquidation data KNOWN at the decision bar (causal only)."

  # QUALITY GATE (DEC-2026-06-04-018, Stage 1 -- by hand 2026-06-09) ----------
  quality_gate:
    stage1_hard_gates:
      mechanism_stated: true          # named price-insensitive forced-seller counterparty
      falsifiable_fail_modes: true
      sample_size_feasible: true      # ONLY via moderate threshold + symbol pooling on 1H
      not_known_dead_pattern: true    # differs from RSI_BB (PATTERN_WITHOUT_EDGE): triggers
                                      # on an EXOGENOUS structural-flow event with a named
                                      # counterparty, not a price-only textbook oscillator
    stage1_scores:   # 0-3 each; pass = mechanism_strength>=2 AND total>=14/21
      mechanism_strength: 3
      crowding_inverse: 1             # LOW -- public liquidation maps; the killer dimension
      crypto_native_fit: 3
      regime_specificity: 3
      parameter_parsimony: 2
      diversity_contribution: 3
      source_credibility: 2
      total: 17
    verdict: PASS   # clears threshold; crowding(1/3) is the yellow flag DSR would adjudicate

  # BLOCKER (why no DSR trial yet) -------------------------------------------
  blocker:
    type: DATA_FEASIBILITY
    detail: >-
      No FREE causal historical liquidation data channel exists. Binance public
      historical liquidation REST (/fapi/v1/allForceOrders) is DEPRECATED ("no
      longer accepts requests"); /fapi/v1/forceOrders is user-private + 90-day
      capped; the forceOrder websocket is real-time-only + throttled (1 push/s
      snapshot, not full volume). Coinglass liquidation-history IS adequate
      (per-symbol long/short, 1h granularity, deep history) but PAID ($29/mo
      Hobbyist minimum, no free tier).
    decision: >-
      DEFER per DEC-2026-06-04-005 (paid alt-data deferred until capital
      >= $25,000; current ~$100). A price-only proxy is rejected: removing the
      exogenous liquidation signal leaves plain price action = the already-DEAD
      H-2026-06-002 breakout. Operator decision 2026-06-09: defer + pivot to the
      funding-at-extremes contrarian (free funding channel, same counterparty).
    unblock_when: >-
      Working capital >= $25,000 (DEC-005 unlocks paid alt-data) OR operator
      approves a Coinglass key as an explicit DEC-005 exception. THEN: build a
      Coinglass liquidation channel mirroring research/data/funding_rates.py
      (fetch + cache + causal liquidations_at(ts) accessor, leakage-guarded),
