- id: H-2026-06-001
  name: "Regime-conditional backtest DSR as a pre-paper screen"
  status: IMPLEMENTED
  proposed_date: 2026-06-06
  proposed_by: operator
  source: >-
    Internal -- forced by the 2026-06-05 retrospective DSR run finding that paper
    trade logs are near-empty (Railway geo-block) and promoted-strategy per-trade
    backtest data was never persisted. Operator decision 2026-06-06.

  # PRE-REGISTRATION ---------------------------------------------------------
  hypothesis: |
    Computing the Deflated Sharpe Ratio SEPARATELY within each market-regime
    bucket of a strategy's regenerated backtest trades -- before any paper
    trading -- identifies which (strategy x regime) pairs carry a backtest edge
    distinguishable from selection-bias luck, and surfaces regime-coverage gaps
    in the portfolio (e.g. no strategy covers TRENDING_BULL).

    This is a SCREEN, not a deployment gate. A regime-DSR pass means the pair is
    WORTH paper-trading; paper/live validation remains the deployment gate. DSR
    is necessary but not sufficient for live edge.
  regime_target: ALL  # the screen evaluates every regime bucket a strategy trades in
  expected_pf: null   # methodology screen, not a single-strategy PF claim
  expected_sharpe: null
  expected_n_per_year: null
  expected_fail_modes:
    - "Per-bucket N too thin for DSR to be meaningful -> mitigated by coarse
       (bull/bear/chop) buckets and an INSUFFICIENT_DATA floor (descriptive, not gating)."
    - "Selection bias ACROSS regimes if K does not count regime buckets as trials
       -> mitigated by effective_K x regime-bucket multiplier."
    - "Lookahead in regime labels -> mitigated by causal classify_series + an
       explicit leakage test (label[i] on series[:i+1] == full-series label[i])."
    - "Backtest edge that does not survive live -> by construction this is a
       screen; paper/live remains the gate."

  # NON-NEGOTIABLE GUARDS (DEC-2026-06-04-014) -------------------------------
  guards:
    - "SCREEN not deployment gate; never bypasses paper validation."
    - "K counts regime-buckets as trials (param-combos x symbols x timeframes x buckets)."
    - "Causal regime tagging at trade ENTRY + leakage test."
    - "Coarse buckets where N thin; below minimum N is DESCRIPTIVE (INSUFFICIENT_DATA)."
    - "DSR necessary, not sufficient."

  # IMPLEMENTATION -----------------------------------------------------------
  implementation_file: scripts/regime_dsr.py
  reuses:
    - research/validation/deflated_sharpe.py   # DSR math (verified)
    - research/validation/effective_k.py       # regime_conditional_k (bucket multiplier)
    - research/backtest/cost_model.py          # incremental-pad (DEC-2026-06-04-013)
    - research/backtest/regime_tagging.py       # causal per-trade SubRegime tagging
    - scripts/retrospective_dsr.py             # analyze_strategy (single statistical core)
    - scripts/backtest_rolling.py              # STRATEGY_PARAMS/SYMBOLS registry
    - src/core/strategy/regime/historical_classifier.py  # causal regime labels
    - src/core/strategy/backtest/                # backtest engine (research imports src/)

  # SUBJECTS (first run) -----------------------------------------------------
  subjects:
    keep: [MACD_PB, BTP, VBB, SRC, ICVP]
    control: [BTF]   # known-bad full-history control (Phase B4)
    retired: [CMF, RSI_BB, HATP, VRB, VPT]

  # RESULTS (populated post-run 2026-06-07) ----------------------------------
  results:
    backtest_date: 2026-06-07
    window_days: 540
    cost_model_verified: false   # v0 incremental-pad, unverified
    leakage_check: passed        # causal tagging self-check held on BTC daily
    btf_calibration: PASSED      # known-bad control -> Tier D in all regimes
    verdict: |
      No KEEP strategy has a DSR-validated edge in ANY regime (every base DSR
      p-value >= 0.67; floor is 0.30). The fine SubRegime breakdown DID surface
      faint, regime-specific POSITIVE cost-adjusted edge that the coarse view
      masked -- strongest in VBB (choppy_bear PF 1.38 / +0.14 Sharpe, choppy_bull
      PF 1.20), then SRC (ranging PF 1.47, choppy_bull PF 1.06) and BTP (ranging
      PF 1.22) -- but all are thin-N and none clears DSR (best base p = 0.67).
      MACD_PB shows NO positive regime cell: its documented choppy_bear edge
      (PF 2.33) did not reproduce (now PF 0.76), consistent with time-window
      selection bias / decay. Treat as a SCREEN result: VBB/SRC choppy cells are
      the "worth paper-trading first" shortlist; none earns live capital.
    paper_trade_shortlist: [VBB.choppy_bear, VBB.choppy_bull, SRC.choppy_bull, SRC.ranging, BTP.ranging]
    reexamine: [MACD_PB]   # documented edge did not reproduce

  biography_file: research/biographies/active/<strategy_id>.yaml  # regime_coverage written per strategy

