- id: H-2026-06-009
  name: "Hyperliquid liquidation-cascade reversion (buy the long-liquidation flush)"
  status: PROPOSED   # Stage-1 PASS 18/21; SCREEN BLOCKED 2026-06-10 (data-accessibility, see blocker)
  proposed_date: 2026-06-10
  proposed_by: operator   # operator request 2026-06-10 ("non-public/less-arbitraged angle")
  source: >-
    The H-2026-06-004 liquidation-cascade thesis via a FREE, less-productized
    venue lens: Hyperliquid publishes all fills incl. liquidations/ADLs on-chain
    (official /info endpoint, public/no-auth, paginated by recency) with a free
    full-history archive (Hydromancer Reservoir S3, requester-pays transfer only).
    This is the FREE path to the over-leveraged-perp counterparty that H-004
    cannot reach (Coinglass paid, DEC-005), and it is genuinely LESS PUBLIC than
    the Coinglass liquidation maps (must parse on-chain fills).

  # PRE-REGISTRATION ---------------------------------------------------------
  hypothesis: |
    In a high-volatility down-move, over-leveraged LONGS on Hyperliquid perps are
    force-liquidated -- the engine market-sells PRICE-INSENSITIVELY, overshooting
    fair value; once the longs are flushed, price snaps back. A SPOT LONG entered
    into a large long-liquidation flush provides liquidity to the forced sellers
    and captures the reversion. Counterparty: force-liquidated leveraged longs
    (price-insensitive sellers who sell the bottom). Edge lives where the
    liquidation signal is LESS PUBLIC (HL on-chain) than the arbitraged Coinglass
    maps. Direction = LONG -> spot-executable, DEPLOYABLE if it passes.
  regime_target: HIGH_VOL
  expected_pf: 1.30
  expected_sharpe: 0.70
  expected_n_per_year: 40    # via a cascade percentile + window (H-006 conjunction lesson) + pooling
  expected_fail_modes:
    - "HL-native bots arbitrage the snap-back intraday -> no residual edge at 1H."
    - "Cascade is a REGIME CHANGE not an overshoot (capitulation continues) ->
       buying the flush catches a falling knife."
    - "Cross-venue decoupling: HL liquidations do not predict the corresponding
       Binance-spot reversion (venue-idiosyncratic flush)."
    - "Thin-N if the cascade threshold is set too high (the H-005 lesson -> use a
       percentile + window, not a same-bar absolute conjunction)."
    - "HL history is short (~2yr) -> fewer high_vol episodes than the 540d majors window."

  # QUALITY GATE (DEC-2026-06-04-018, Stage 1 -- by hand 2026-06-10) ----------
  quality_gate:
    stage1_hard_gates:
      mechanism_stated: true          # price-insensitive forced-seller counterparty
      falsifiable_fail_modes: true
      sample_size_feasible: true      # percentile+window+pool; data free (HL /info + S3)
      not_known_dead_pattern: true    # H-004 is DATA-BLOCKED (not screened/dead); this is its free path
    stage1_scores:   # 0-3; pass = mechanism>=2 AND total>=14/21
      mechanism_strength: 3
      crowding_inverse: 2             # on-chain parse less-mapped than Coinglass; but HL bots are fast
      crypto_native_fit: 3
      regime_specificity: 3
      parameter_parsimony: 2
      diversity_contribution: 3       # first liquidation-flow + first DEX venue
      source_credibility: 2
      total: 18
    verdict: PASS   # strongest of the five on mechanism + inverse-crowding; heaviest build

  implementation_file: research/generators/hl_liquidation_reversion.py   # TO BUILD
  eval_path: "python -m scripts.regime_dsr --strategy HL_LIQ_REVERSION --market spot"
  infrastructure_required:
    - "Hyperliquid liquidation data channel (research/data/hl_liquidations.py): fetch
       + cache + a CAUSAL liquidations_at(ts) accessor. FREE (HL /info recency
       pagination, or the Hydromancer S3 requester-pays archive for deep history).
       HEAVIEST build of the three survivors (cross-venue + possibly boto3/S3)."
    - "Cross-venue mapping HL-liquidations -> Binance-spot symbol (or trade the
       reversion on HL-listed majors). Verify history depth covers the window."
  registration:
    research_label: HL_LIQ_REVERSION
    template_id: hl_liquidation_reversion
    parameters:    # FROZEN intent; finalize at implementation
      liq_lookback_days: 30
      liq_percentile_threshold: 90.0   # cascade = top-decile long-liquidation bar
      reversal_confirm_bars: 3
      atr_period: 14
      atr_stop_multiplier: 2.5
    symbols: [BTCUSDT, ETHUSDT, SOLUSDT]   # HL-listed majors; widen on go-ahead
    market: spot
  effective_k_at_proposal: null
  similar_retired_strategies: []
  # BLOCKER (data-accessibility; verified 2026-06-10 BEFORE building) ---------
  blocker:
    type: DATA_ACCESSIBILITY
    detail: >-
      A causal 540d market-wide HL liquidation series is NOT buildable from
      free+accessible sources in this environment. Hyperliquid /info has NO
      market-wide liquidation request type (verified: the documented `type` list
      lacks one; probes type=liquidations/recentLiquidations -> 422). Liquidations
      exist only via the real-time WebSocket (no history) or per-user fills (need
      the address universe). candleSnapshot is capped at 5000 candles (~208d on
      1H), so even HL OHLCV is too shallow. The deep-history archive (Hydromancer
      Reservoir S3) is FREE-of-fee but REQUESTER-PAYS, needing AWS credentials
      this sandbox does not have.
    decision: >-
      DEFER. Do NOT fake it with a price proxy (removing the exogenous liquidation
      signal = the already-DEAD H-002 price action). Stage-1 PASS (18/21) frozen
      above; the mechanism is the strongest in the program but the FREE-data lens
      is inaccessible here.
    unblock_when: >-
      (a) operator provides AWS credentials to read the Hydromancer S3 archive
      (free-of-fee, pay only transfer); OR (b) forward-collect HL liquidations via
      the WebSocket from now (builds history over time, not screenable today); OR
      (c) capital >= $25k unlocks a paid market-wide liq source (Coinglass,
      DEC-2026-06-04-005) -- which also unblocks H-2026-06-004.
  results: null   # SCREEN blocked (data-accessibility); no DSR trial spent
  biography_file: null   # no screen run

