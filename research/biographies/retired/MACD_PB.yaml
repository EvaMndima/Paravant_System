    peak_classification: KEEP (informal, PF-based; never DSR-validated)
    final_classification: DECAYED
    cumulative_live_pnl_pct: 0.0
    cumulative_live_trades: 0
    final_live_pf: null
  primary_cause: REGIME_SHIFT
  causal_analysis: 'MACD_PB (MACD pullback; DOGEUSDT, AVAXUSDT) was promoted to KEEP
    status in May 2026 on a strong choppy_bear backtest edge (PF 2.33). The regime-conditional
    DSR screen (DEC-2026-06-04-014) re-evaluated it over two windows. In the ~90-day
    promotion-era window (ending 2026-05-28) choppy_bear was genuinely positive: PF
    1.97, Sharpe +0.29 (N=8) -- confirming the edge was REAL at promotion, not fabricated.
    Over the full 540-day window (ending 2026-06-07) the same choppy_bear cell fell
    to PF 0.76 (Sharpe -0.12), and MACD_PB showed NO positive cost-adjusted cell in
    ANY regime (coarse or fine, every base DSR p >= 0.90). The edge DECAYED as the
    macro regime shifted from the bear/choppy conditions of early 2026 toward bull
    recovery: MACD_PB is a choppy_bear-fit strategy whose regime departed. Critically,
    even at promotion the edge was never DSR-validated -- its best-window choppy_bear
    p was 0.569, above the 0.30 floor (N=8 thin). The strategy was real-but-fragile,
    and the decay confirmed the fragility the (then-absent) DSR gate would have flagged.
    Retired because no positive edge remains in any current regime and its single-regime
    concentration makes it structurally vulnerable to exactly the regime shift that
    occurred.'
  contributing_factors:
  - 'Regime shift: bear/choppy (early 2026) -> bull recovery, removing the choppy_bear
    conditions the strategy depends on.'
  - 'Single-regime concentration: edge confined to choppy_bear, with no expression
    in trending or bull regimes.'
  - Never DSR-validated at promotion (PF-based gate); best-window DSR p=0.569 was
    above the 0.30 floor.
  - 'Thin sample: choppy_bear N=8 at promotion, N=14 over the full window -- wide
    confidence intervals throughout.'
  lessons:
  - lesson_id: LESS-2026-06-001
    category: REGIME_FIT
    description: 'Single-SubRegime edges (here choppy_bear) carry concentration risk:
      when that regime exits, the edge has nowhere to express. Weight multi-regime
      robustness in promotion, or deploy strictly in-regime via the router.'
    pattern_tags:
    - single-regime
    - choppy-bear-only
    - regime-dependent
    applies_to_future_hypotheses_in:
    - CHOPPY_BEAR
    - TRENDING_BULL
  - lesson_id: LESS-2026-06-002
    category: PROMOTION_RIGOR
    description: A PF-based promotion deployed an edge with DSR p=0.569 (above the
      floor) that then decayed. Real-but-fragile edges (positive PF but DSR p above
      floor) should be paper-validated in-regime, not promoted on PF alone. The DSR
      gate would have held this back.
    pattern_tags:
    - real-but-fragile
    - dsr-above-floor
    - pf-only-promotion
    applies_to_future_hypotheses_in:
    - all
  pattern_tags:
  - macd-based
  - pullback-entry
  - choppy-bear
  - single-regime
  - regime-dependent
  - retired-by-decay
  - real-but-fragile
