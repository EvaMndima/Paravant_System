[project]
name = "paravant-trading"
version = "0.1.0"
description = "Personal Autonomous Trading System - MVP"
authors = [
    {name = "Eva Mndima", email = "enairuko@gmail.com"}
]
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # API
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    
    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.19.0",
    
    # HTTP & WebSocket
    "httpx>=0.26.0",
    "websockets>=12.0",
    
    # Data Processing
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    
    # Crypto Exchange
    "python-binance>=1.0.19",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
    
    # Alerting
    "python-telegram-bot>=20.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=24.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "types-PyYAML>=6.0.0",
    "pre-commit>=3.6.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-ra",
]
markers = [
    "unit: Unit tests (fast, no external deps)",
    "integration: Integration tests (may need DB)",
    "slow: Slow tests (backtests, etc)",
    "binance: Tests requiring Binance connection",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.pytest-asyncio]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Declared explicitly rather than inherited from a version's defaults. Leaving
# this unset meant the enforced rule set changed with the installed ruff: 0.15
# reported a clean tree where 0.16 reported 1,013 findings. The pin in
# requirements-dev.txt fixes the version; this fixes what it checks.
#
#   E4  import placement and shadowing
#   E7  statement-level errors (comparisons, ambiguous names, one-line blocks)
#   E9  syntax and runtime errors
#   F   pyflakes: undefined names, unused imports and variables
#
# Broadening this set is worthwhile and is its own commit, since each new rule
# family produces a diff that should be reviewed rather than auto-applied.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# python-binance ships no type stubs and no py.typed marker. The wrapper in
# src/brokers/binance/client.py is fully annotated at its own boundary, so the
# untyped third-party surface stops there rather than leaking into src/.
[[tool.mypy.overrides]]
module = ["binance.*"]
ignore_missing_imports = true

# requests ships no stubs in this environment. types-requests is declared in
# requirements-dev.txt; this keeps a bare research/ check from failing when it
# is absent.
[[tool.mypy.overrides]]
module = ["requests.*"]
ignore_missing_imports = true
