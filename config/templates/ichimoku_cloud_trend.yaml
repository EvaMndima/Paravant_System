# Ichimoku Cloud Trend Strategy Template
# Full Ichimoku Kinko Hyo system with crypto-adjusted periods
# Five-point confluence for high-conviction trend entries
#
# Entry Logic: Price vs Cloud + TK Cross + Chikou + Cloud Color + Volume
# Exit Logic: Cloud flip or TK cross against position

id: "ichimoku_cloud_trend"
name: "Ichimoku Cloud Trend"
version: "1.0.0"
type: "trend_following"
description: >
  Implements the full Ichimoku Kinko Hyo cloud system adapted for
  24/7 crypto markets (20/60/120/30 periods instead of 9/26/52/26).
  Requires all five Ichimoku conditions to align for entry, producing
  rare but high-conviction trend-following signals. Includes CLOSE
  signals when price enters the cloud with a TK cross against.

entry_logic: >
  LONG (all 5 required):
    1. Price closes above cloud top (both Senkou spans)
    2. Tenkan-sen crosses above Kijun-sen (TK bullish cross)
    3. Chikou span confirms uptrend (current close > close[displacement bars ago])
    4. Cloud is green (Senkou A > Senkou B)
    5. Volume exceeds threshold * average volume
  SHORT (all 5 required):
    1. Price closes below cloud bottom
    2. Tenkan crosses below Kijun (TK bearish cross)
    3. Chikou span confirms downtrend
    4. Cloud is red (Senkou B > Senkou A)
    5. Volume exceeds threshold * average volume

exit_logic: >
  CLOSE: Price enters cloud + TK cross against position direction.
  Stop: Max of (cloud boundary, 2*ATR from entry).

parameters:
  - name: "tenkan_period"
    type: "int"
    min: 9
    max: 30
    default: 20
    step: 1
    description: "Tenkan-sen (conversion line) period"

  - name: "kijun_period"
    type: "int"
    min: 26
    max: 80
    default: 60
    step: 5
    description: "Kijun-sen (base line) period"

  - name: "senkou_b_period"
    type: "int"
    min: 52
    max: 150
    default: 120
    step: 10
    description: "Senkou Span B (leading span B) period"

  - name: "displacement"
    type: "int"
    min: 10
    max: 40
    default: 30
    step: 5
    description: "Cloud displacement (shift forward) in periods"

  - name: "atr_period"
    type: "int"
    min: 10
    max: 20
    default: 14
    step: 2
    description: "ATR period for stop loss calculation"

  - name: "volume_period"
    type: "int"
    min: 10
    max: 30
    default: 20
    step: 5
    description: "Volume moving average period"

  - name: "volume_threshold"
    type: "float"
    min: 1.0
    max: 2.5
    default: 1.3
    step: 0.1
    description: "Volume multiplier above average for confirmation"

expected_performance:
  min_sharpe: 0.5
  max_drawdown_pct: 25.0
  min_win_rate_pct: 38.0

recommended_for:
  - "trending_down"
  - "trending_up"

not_recommended_for:
  - "ranging"

symbols:
  - "BTCUSDT"
  - "ETHUSDT"

timeframes:
  - "1h"
