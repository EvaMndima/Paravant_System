# EMA Trend + RSI Filter Strategy Template
# Primary strategy for trend-following with momentum confirmation
#
# Entry Logic: EMA crossover with RSI confirmation
# Exit Logic: EMA cross-back or RSI extreme reversal

id: "ema_trend_rsi"
name: "EMA Trend + RSI Filter"
version: "1.0.0"
type: "trend_following"
description: >
  Combines exponential moving average crossovers with RSI momentum
  filtering. Enters long when fast EMA crosses above slow EMA and RSI
  is above the buy threshold. Exits when fast EMA crosses below slow
  EMA or RSI reaches overbought levels. Designed for trending markets
  with moderate volatility.

entry_logic: >
  LONG: Fast EMA crosses above Slow EMA AND RSI > buy_threshold.
  SHORT: Fast EMA crosses below Slow EMA AND RSI < sell_threshold.
  Additional filter: Only enter if ADX > 20 (trend strength).

exit_logic: >
  CLOSE LONG: Fast EMA crosses below Slow EMA OR RSI > overbought_level.
  CLOSE SHORT: Fast EMA crosses above Slow EMA OR RSI < oversold_level.
  Stop loss: ATR-based trailing stop at atr_multiplier * ATR.

parameters:
  - name: "fast_ema_period"
    type: "int"
    min: 5
    max: 50
    default: 12
    step: 1
    description: "Fast EMA lookback period"

  - name: "slow_ema_period"
    type: "int"
    min: 20
    max: 200
    default: 26
    step: 1
    description: "Slow EMA lookback period"

  - name: "rsi_period"
    type: "int"
    min: 7
    max: 28
    default: 14
    step: 1
    description: "RSI calculation period"

  - name: "rsi_buy_threshold"
    type: "float"
    min: 30.0
    max: 60.0
    default: 45.0
    step: 5.0
    description: "RSI level above which buys are allowed"

  - name: "rsi_sell_threshold"
    type: "float"
    min: 40.0
    max: 70.0
    default: 55.0
    step: 5.0
    description: "RSI level below which sells are allowed"

  - name: "rsi_overbought"
    type: "float"
    min: 65.0
    max: 90.0
    default: 75.0
    step: 5.0
    description: "RSI overbought exit level"

  - name: "rsi_oversold"
    type: "float"
    min: 10.0
    max: 35.0
    default: 25.0
    step: 5.0
    description: "RSI oversold exit level"

  - name: "atr_multiplier"
    type: "float"
    min: 1.0
    max: 5.0
    default: 2.0
    step: 0.5
    description: "ATR multiplier for stop loss distance"

  - name: "atr_period"
    type: "int"
    min: 7
    max: 28
    default: 14
    step: 1
    description: "ATR calculation period"

expected_performance:
  min_sharpe: 1.2
  max_drawdown_pct: 12.0
  min_win_rate_pct: 48.0

recommended_for:
  - "trending_up"
  - "trending_down"

not_recommended_for:
  - "ranging"
  - "volatile"

symbols:
  - "BTCUSDT"
  - "ETHUSDT"
  - "BNBUSDT"

timeframes:
  - "1h"
  - "4h"
