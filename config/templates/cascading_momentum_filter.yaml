# Cascading Momentum Filter Strategy Template
# Triple-timeframe (1H+4H+Daily) cascade requiring all 3 TFs to agree
# Highest conviction but lowest frequency signals
#
# Entry Logic: Daily ST regime + 4H EMA slope/ADX + 1H ST flip + MACD
# Exit Logic: 2*ATR stop, ride the trend

id: "cascading_momentum_filter"
name: "Cascading Momentum Filter"
version: "1.0.0"
type: "trend_following"
description: >
  Triple-timeframe trend-following strategy requiring ALL three timeframes
  to agree before entry. Daily SuperTrend sets the macro regime, 4H EMA
  slope plus ADX confirms trend momentum, and 1H SuperTrend flip plus
  MACD crossover provides precise entry timing. Produces rare but very
  high-conviction signals (0.8-1.0 strength). Requires 350+ 1H bars
  (~15 days) for Daily SuperTrend warmup.

entry_logic: >
  LAYER 1 (Daily): SuperTrend direction defines allowed trade direction.
  LAYER 2 (4H): EMA slope must agree with Daily + ADX > min threshold.
  LAYER 3 (1H): SuperTrend must JUST flip in cascade direction
                + MACD histogram confirms and is accelerating.
  ALL 3 layers must agree. Any disagreement = no signal.
  LONG: Daily ST bullish + 4H EMA slope > 0 + 4H ADX > min
        + 1H ST just flipped bullish + 1H MACD histogram > 0 rising.
  SHORT: Daily ST bearish + 4H EMA slope < 0 + 4H ADX > min
         + 1H ST just flipped bearish + 1H MACD histogram < 0 falling.

exit_logic: >
  Stop: 2 * ATR from entry price.
  Target: Ride the triple-confirmed trend.
  No time stop (trends can run for extended periods).

parameters:
  - name: "daily_st_period"
    type: "int"
    min: 7
    max: 14
    default: 10
    step: 1
    description: "Daily SuperTrend ATR period"

  - name: "daily_st_multiplier"
    type: "float"
    min: 2.0
    max: 4.0
    default: 3.0
    step: 0.5
    description: "Daily SuperTrend ATR multiplier"

  - name: "htf_ema_period"
    type: "int"
    min: 15
    max: 30
    default: 21
    step: 3
    description: "4H EMA period for slope calculation"

  - name: "htf_adx_period"
    type: "int"
    min: 10
    max: 20
    default: 14
    step: 2
    description: "4H ADX period"

  - name: "htf_adx_min"
    type: "float"
    min: 10.0
    max: 30.0
    default: 15.0
    step: 5.0
    description: "Minimum 4H ADX for trend confirmation"

  - name: "htf_slope_lookback"
    type: "int"
    min: 3
    max: 10
    default: 5
    step: 1
    description: "Lookback periods for 4H EMA slope calculation"

  - name: "st_period_1h"
    type: "int"
    min: 7
    max: 14
    default: 10
    step: 1
    description: "1H SuperTrend ATR period"

  - name: "st_multiplier_1h"
    type: "float"
    min: 2.0
    max: 4.0
    default: 3.0
    step: 0.5
    description: "1H SuperTrend ATR multiplier"

  - name: "macd_fast"
    type: "int"
    min: 8
    max: 16
    default: 12
    step: 2
    description: "1H MACD fast EMA period"

  - name: "macd_slow"
    type: "int"
    min: 20
    max: 30
    default: 26
    step: 2
    description: "1H MACD slow EMA period"

  - name: "macd_signal"
    type: "int"
    min: 5
    max: 12
    default: 9
    step: 1
    description: "1H MACD signal line period"

  - name: "atr_period"
    type: "int"
    min: 10
    max: 20
    default: 14
    step: 2
    description: "ATR period for stop loss"

expected_performance:
  min_sharpe: 0.7
  max_drawdown_pct: 20.0
  min_win_rate_pct: 45.0

recommended_for:
  - "trending_down"
  - "trending_up"

not_recommended_for:
  - "ranging"
  - "volatile"

symbols:
  - "BTCUSDT"
  - "ETHUSDT"

timeframes:
  - "1h"
