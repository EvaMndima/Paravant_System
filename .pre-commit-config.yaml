# Local gates that mirror .github/workflows/ci.yml, so a failure is found
# before the push rather than after it.
#
#   pip install pre-commit && pre-commit install
#
# Deliberately excluded:
#   - black. `black --check` currently reports 192 files needing reformat. The
#     repository has never been formatted with it despite the [tool.black]
#     config. Enabling it here would either reformat 192 files inside an
#     unrelated commit or fail every commit. Reformatting is a decision worth
#     making on its own, in one labelled commit with a .git-blame-ignore-revs
#     entry. See docs/PRODUCTION_READINESS_ASSESSMENT.md.
#   - the full pytest suite. It takes ~60s; that belongs in CI, not in the
#     path of every commit.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key
      # A .env must never be committed. It has not been, across 120+ commits,
      # and this keeps it that way.
      - id: check-added-large-files
        name: block .env from being committed
        entry: bash -c 'git diff --cached --name-only | grep -qxF ".env" && { echo "refusing to commit .env"; exit 1; } || exit 0'
        language: system
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(src|research|scripts|tests)/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        files: ^src/
        additional_dependencies:
          - types-psutil
          - types-PyYAML
        # pyproject declares disallow_untyped_defs = true and src/ is currently
        # clean. Keep it that way.
        args: [--config-file=pyproject.toml]
