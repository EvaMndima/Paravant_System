# Dependency update automation.
#
# Every dependency in this repository is pinned exactly (see the header of
# requirements.txt for the incident that motivated that). Pinning removes
# surprise upgrades but transfers the burden of noticing security advisories
# onto a human who will not reliably notice them. Dependabot is the other half
# of that trade: pinning makes upgrades deliberate, this makes them visible.
#
# Grouped and rate-limited on purpose. An unbounded stream of single-dependency
# PRs on a solo project gets ignored, and an ignored alert is worse than none --
# the same failure mode as a flaky test (DEC-2026-08-14-005).

version: 2

updates:
  # ---------------------------------------------------------------------------
  # Python
  # ---------------------------------------------------------------------------
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    commit-message:
      prefix: build
      include: scope
    groups:
      # Patch and minor bumps are reviewed together; a major bump gets its own
      # PR because it needs the CI matrix read carefully rather than skimmed.
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ---------------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: build
      include: scope
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # React 19 is current and deliberate. A major bump here would be a
      # migration, not an update, and should be opened by hand.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]

  # ---------------------------------------------------------------------------
  # CI actions and the base image
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: build
